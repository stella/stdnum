[install]
# 5-day quarantine: reject package versions published
# less than 5 days ago to mitigate supply chain attacks.
minimumReleaseAge = 432000
minimumReleaseAgeExcludes = [
  # bun-types ships only declarations and must match the pinned Bun runtime.
  "@stll/oxlint-plugin", # quarantine-excluded-since: 2026-10-22T15:08:24.413Z
  "@stll/oxlint-config", # quarantine-excluded-since: 2026-06-03T14:49:06.000Z
  "@stll/typescript-config", # quarantine-excluded-since: 2026-06-03T14:49:06.000Z
  "@stll/stdnum-darwin-arm64", # quarantine-excluded-since: 2026-10-22T15:08:24.413Z
  "@stll/stdnum-darwin-x64", # quarantine-excluded-since: 2026-10-22T15:08:24.413Z
  "@stll/stdnum-linux-arm64-gnu", # quarantine-excluded-since: 2026-10-22T15:08:24.413Z
  "@stll/stdnum-linux-x64-gnu", # quarantine-excluded-since: 2026-10-22T15:08:24.413Z
  "@stll/stdnum-wasm", # quarantine-excluded-since: 2026-10-22T15:08:24.413Z
  "@stll/stdnum-win32-x64-msvc", # quarantine-excluded-since: 2026-10-22T15:08:24.413Z
]

[fmt]
printWidth = 80
ignorePatterns = [
  # Shared generated files (stll-toolchain formatter policy).
  ".ai/shared/**",
  ".agents/skills/**",
  ".claude/skills/**",
  "**/AGENTS.md",
  "**/GEMINI.md",
  "**/CLAUDE.md",
  ".github/dependabot.yml",
  "**/fixtures/**",
  "**/__fixtures__/**",
  "**/testdata/**",
  "**/__snapshots__/**",
]

[fmt.sortImports]
customGroups = [
  { groupName = "react", elementNamePattern = [
    "react",
    "react-dom",
    "react-dom/**",
  ] },
  { groupName = "stella", elementNamePattern = ["@stll/**"] },
  { groupName = "aliases", elementNamePattern = ["@/**"] },
]
groups = [
  "react",
  ["builtin", "external", "type-builtin", "type-external"],
  "stella",
  "aliases",
  ["parent", "sibling", "index", "type-parent", "type-sibling", "type-index"],
]
newlinesBetween = true
