# cargo-fuzz targets for the stdnum core.
#
# This crate is intentionally its own workspace (empty `[workspace]` table
# below) so it stays out of the main `--workspace` build and its strict lints.
# It also keeps `libfuzzer-sys` off the default build/test path. Stable CI
# compiles and coverage-guided smoke-runs the target with
# `cargo fuzz run validate_id --sanitizer none` (see `fuzz/README.md`).

[package]
license = "Apache-2.0"
name = "stella-stdnum-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
stella-stdnum-core = { path = "../crates/stdnum-core" }

# Detach from the parent workspace so `cargo build --workspace` at the repo root
# never pulls in the fuzz targets or their target dependencies.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "validate_id"
path = "fuzz_targets/validate_id.rs"
test = false
doc = false
bench = false
