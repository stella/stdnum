[package]
name = "stella-stdnum-wasm"
version.workspace = true
edition.workspace = true
description = "WebAssembly bindings for Stella standard identifier validation"
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
stella-stdnum-core = { path = "../stdnum-core" }
wasm-bindgen = "0.2"

[lints]
workspace = true
