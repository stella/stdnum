[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "stella-stdnum-core"
dynamic = ["version"]
description = "Python bindings for Stella standard identifier validation"
readme = "../../README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Typing :: Typed",
]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "stella_stdnum_core_py"
