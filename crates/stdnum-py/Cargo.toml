[package]
name = "stella-stdnum-py"
version.workspace = true
edition.workspace = true
description = "Python bindings for Stella standard identifier validation"
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py311"] }
stella-stdnum-core = { path = "../stdnum-core" }

[build-dependencies]
pyo3-build-config = { version = "0.29", features = [
  "extension-module",
] }

[lints]
workspace = true
