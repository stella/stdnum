[package]
name = "stella-stdnum-py"
version.workspace = true
edition.workspace = true
description = "Python bindings for Stella standard identifier validation"
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "stella_stdnum_core_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = [
  "extension-module",
  "abi3-py311",
] }
stella-stdnum-core = { path = "../stdnum-core" }

[build-dependencies]
pyo3-build-config = { version = "0.29", features = [
  "extension-module",
] }

[lints]
workspace = true
