[package]
name = "stella-stdnum-wasm-size-fixture"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[features]
default = ["validator-set"]
canonical-predicates = []
validator-set = []

[dependencies]
stella-stdnum-core = { path = "../stdnum-core" }
wasm-bindgen = "=0.2.126"

# Keep this fixture independent so it exercises the explicit profile expected
# from constrained WebAssembly consumers.
[workspace]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
