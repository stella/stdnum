version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 3 * * *"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"

  - package-ecosystem: "bun"
    directories:
      - "/"
    schedule:
      interval: "cron"
      cronjob: "0 3 * * *"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      oxc:
        patterns:
          - "oxlint"
          - "oxfmt"
        update-types:
          - "major"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"

  - package-ecosystem: "pip"
    directories:
      - "/scripts/oracle"
      - "/crates/stdnum-py/tests"
    schedule:
      interval: "cron"
      cronjob: "0 3 * * *"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bundler"
    directory: "/scripts/oracle"
    schedule:
      interval: "cron"
      cronjob: "0 3 * * *"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "composer"
    directory: "/scripts/oracle"
    schedule:
      interval: "cron"
      cronjob: "0 3 * * *"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/scripts/rust-oracle"
    schedule:
      interval: "cron"
      cronjob: "0 3 * * *"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
