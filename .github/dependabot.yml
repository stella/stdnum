version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"

  - package-ecosystem: "bun"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 5
    groups:
      oxc:
        patterns:
          - "oxlint"
          - "oxfmt"
      misc:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"

  - package-ecosystem: "pip"
    directories:
      - "/scripts/oracle"
      - "/crates/stdnum-py/tests"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"

  - package-ecosystem: "bundler"
    directory: "/scripts/oracle"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"

  - package-ecosystem: "composer"
    directory: "/scripts/oracle"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"

  - package-ecosystem: "cargo"
    directory: "/scripts/rust-oracle"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"
