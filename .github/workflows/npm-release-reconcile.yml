name: npm release reconcile

# Publishes GitHub releases that the release finalizer left as drafts because
# npm had not yet listed every accepted package version.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    name: Reconcile
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/npm-release-reconcile.yml@0cc2def60afb3e0fac0df9f541baf926f77889fa
    with:
      package-files: |
        packages/stdnum/package.json
        packages/stdnum-wasm/package.json
        packages/stdnum-linux-x64-gnu/package.json
        packages/stdnum-linux-arm64-gnu/package.json
        packages/stdnum-darwin-x64/package.json
        packages/stdnum-darwin-arm64/package.json
        packages/stdnum-win32-x64-msvc/package.json
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
