name: Release PR

on:
  push:
    branches: [main]

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    name: Maintain version packages PR
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: stella/.github/.github/workflows/changeset-release-pr.yml@0cc2def60afb3e0fac0df9f541baf926f77889fa
    with:
      bun-version-file: package.json
      sync-cargo-inherited-lock: true
    secrets:
      CHANGELOG_APP_ID: ${{ secrets.CHANGELOG_APP_ID }}
      CHANGELOG_APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
