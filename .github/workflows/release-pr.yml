name: Release PR

on:
  push:
    branches: [main]

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  version:
    name: Maintain version packages PR
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/changeset-release-pr.yml@1ce0079bbdbf93a4c1917d2857496b89aedcec14
    with:
      bun-version-file: package.json
      sync-cargo-inherited-lock: true
    secrets:
      CHANGELOG_APP_ID: ${{ secrets.CHANGELOG_APP_ID }}
      CHANGELOG_APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
