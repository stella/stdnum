name: Release policy

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-policy.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-policy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce:
    name: Enforce release boundaries
    uses: stella/.github/.github/workflows/release-policy.yml@65ca33c9cc40124def02795451571cb4207f69d0
    permissions:
      contents: read
