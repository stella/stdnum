name: Package quarantine policy

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  enforce:
    name: Enforce package quarantine
    if: github.repository == 'stella/stdnum'
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/quarantine-policy.yml@41fbea3b521bfc57b791003918de97f153d790a7
