name: Package quarantine policy

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  enforce:
    name: Enforce package quarantine
    if: github.repository == 'stella/stdnum'
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/quarantine-policy.yml@0cc2def60afb3e0fac0df9f541baf926f77889fa
