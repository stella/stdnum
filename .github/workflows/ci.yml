name: CI

on:
  push:
    branches: [main]
  pull_request:
    types:
      [
        opened,
        synchronize,
        reopened,
        ready_for_review,
        labeled,
      ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trust-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
    steps:
      - name: Check if PR is trusted
        id: check
        env:
          HEAD_REPO: >-
            ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          HAS_RUN_CI_LABEL: >-
            ${{ contains(github.event.pull_request.labels.*.name, 'run-ci') }}
        run: |
          if [[ "$HEAD_REPO" == "$BASE_REPO" ]]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          elif [[ "$HAS_RUN_CI_LABEL" == "true" ]]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Fork PR without 'run-ci' label — CI skipped."
          fi

  changeset:
    name: Changeset
    if: >-
      github.event_name == 'pull_request'
      && needs.trust-check.outputs.trusted == 'true'
    needs: [trust-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"
      - run: bun install --frozen-lockfile
      - name: Require a changeset for runtime source changes
        run: |
          bun run changeset:check:test
          bun run changeset:check
        env:
          CHANGESET_HEAD_REF: ${{ github.head_ref }}
          CHANGESET_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CHANGESET_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          CHANGESET_REPOSITORY: ${{ github.repository }}

  lint:
    name: Lint
    if: >-
      always()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [trust-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check

  version-sync:
    name: Version sync
    if: >-
      always()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [trust-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.21.1"
      - run: node scripts/version-sync.mjs check

  test:
    name: Test
    if: >-
      always()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [trust-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun test

  oracle:
    name: Oracle
    if: >-
      always()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [trust-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install pinned cross-language oracle packages
        run: |
          uv venv .venv --python python3
          uv pip install --python .venv/bin/python \
            --requirement scripts/oracle/requirements.txt
          export GEM_HOME="$RUNNER_TEMP/ruby-gems"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install bundler --version 2.4.22 --no-document
          BUNDLE_GEMFILE=scripts/oracle/Gemfile bundle install
          composer install --working-dir=scripts/oracle \
            --no-interaction \
            --no-progress
          cargo build --release --locked \
            --manifest-path scripts/rust-oracle/Cargo.toml
      - name: Build the Rust-backed Node binding
        run: bun run build
      - run: ORACLE_SAMPLES=500 bun run oracle

  rust:
    name: Rust
    if: >-
      always()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [trust-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile

      - name: Setup Rust
        # 1.96.0 is the pinned toolchain (rust-toolchain.toml); the nightly with
        # rustc-dev is only needed to build the shared Dylint lint libraries.
        run: |
          rustup toolchain install 1.96.0 --profile minimal \
            --component rustfmt,clippy
          rustup toolchain install nightly-2026-04-16 --profile minimal \
            --component rustc-dev \
            --component llvm-tools-preview
          rustup default 1.96.0
          cargo install cargo-dylint --version 6.0.1 --locked
          cargo install dylint-link --version 6.0.1 --locked

      - name: Install pinned Rust CI tools (checksum-verified)
        # Prebuilt nextest (the `cargo ci-test` runner), cargo-deny (the
        # supply-chain gate, `cargo ci-deny`), and cargo-insta (the
        # snapshot-hygiene gate, `cargo ci-snapshot`); avoids a from-source
        # compile on every CI run. taiki-e/install-action verifies release
        # checksums, unlike a raw `curl | tar`.
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest@0.9.140,cargo-deny@0.20.2,cargo-insta@1.48.0

      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-1.96.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.96.0-

      - name: Rust checks (fmt, clippy, dylint, test)
        run: bun run rust:check

      - name: Cargo deny (supply chain)
        # Full-tree license/advisory/source/duplicate checks; complements the
        # PR-scoped dependency-review action. See deny.toml.
        run: bun run rust:deny

      - name: Snapshot hygiene (insta)
        # Rejects snapshot mismatches and orphaned .snap files no test
        # references anymore.
        run: bun run rust:snapshot-check

      - name: Fuzz targets compile (anti-bitrot)
        # The fuzz crate is its own workspace, so it is not covered by the
        # `--workspace` build above and can silently stop compiling when the
        # core public API changes. A compile-check (no nightly / cargo-fuzz /
        # sanitizer needed) keeps the targets honest; actual fuzzing runs
        # locally or on demand (see fuzz/README.md).
        run: cargo check --manifest-path fuzz/Cargo.toml --bins

  build:
    name: Bindings and packages
    if: >-
      always()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [trust-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: Install the WebAssembly build toolchain
        run: |
          rustup target add wasm32-unknown-unknown --toolchain 1.96.0
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - run: bun run typecheck
      - run: bun run build
      - run: bun run performance
      - run: bun run codegen:check
      - run: bun run smoke:native
      - run: bun run build:wasm
      - run: bun run smoke:wasm
      - run: bun run readme:check
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build the Python abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          rust-toolchain: "1.96.0"
          args: >-
            --release
            --locked
            --manifest-path crates/stdnum-py/Cargo.toml
            --out dist-python
      - name: Install and test the Python wheel
        run: |
          uv venv .python-smoke --python python3
          uv pip install --python .python-smoke/bin/python \
            --requirement crates/stdnum-py/tests/requirements.txt \
            dist-python/*.whl
          .python-smoke/bin/python -m unittest discover -s crates/stdnum-py/tests -v
          .python-smoke/bin/ty check \
            --python .python-smoke/bin/python \
            crates/stdnum-py/tests/typing_contract.py

  pack:
    name: Pack
    if: >-
      always()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [trust-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.21.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run smoke:pack
