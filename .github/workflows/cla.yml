name: CLA Assistant

on:
  workflow_dispatch:
    inputs:
      pull_requests:
        description: Pull request numbers separated by commas or spaces
        type: string
        required: true
  issue_comment:
    types: [created]
  pull_request_target: # zizmor: ignore[dangerous-triggers] delegates to pinned reusable CLA workflow; never check out PR code here
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  checks: write
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      (
        github.event_name == 'pull_request_target'
        || github.event_name == 'workflow_dispatch'
      ) || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && (
          github.event.comment.body == 'recheck'
          || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        )
      )
    uses: stella/.github/.github/workflows/cla.yml@ba5f7da76aededf6f22814de93c72a49843fcc8e
    with:
      allowlist: dependabot[bot],renovate[bot],github-actions[bot],google-labs-jules[bot],cursoragent,stella-provenance-updater[bot],autofix-ci[bot]
    secrets:
      CLA_APP_PRIVATE_KEY: ${{ secrets.CLA_APP_PRIVATE_KEY }}

  required-cla:
    # The ruleset requires this literal context; propagate the reusable result.
    name: cla
    needs: cla
    if: always() && needs.cla.result != 'skipped'
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require successful CLA check
        env:
          CLA_RESULT: ${{ needs.cla.result }}
        run: test "$CLA_RESULT" = success
