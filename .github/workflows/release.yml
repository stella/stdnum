name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      publish_to_registries:
        description: Publish npm packages and PyPI wheels after verification
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    outputs:
      dist_tag: ${{ steps.version.outputs.dist_tag }}
      publish: ${{ steps.scope.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.21.1"

      - name: Require main for manual publishing
        if: >-
          github.event_name == 'workflow_dispatch'
          && inputs.publish_to_registries
          && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Manual publishing must run from main."
          exit 1

      - name: Resolve publish scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish_to_registries }}
        run: |
          set -euo pipefail
          publish=false
          if [[ "$EVENT_NAME" == "push" || "$MANUAL_PUBLISH" == "true" ]]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Validate VERSION and derive npm tag
        id: version
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)\.[0-9]+)?$ ]]; then
            echo "::error::Invalid VERSION: $version"
            exit 1
          fi
          dist_tag=latest
          if [[ "$version" =~ -(rc|beta|alpha)\. ]]; then
            dist_tag="${BASH_REMATCH[1]}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          rustup default 1.96.0

      - name: Verify versions and generated sources
        run: |
          bun run version:check
          bun run codegen:check

      - name: Verify source and bindings
        run: |
          bun run typecheck
          bun run lint
          bun run format:check
          cargo test --workspace --locked
          bun test

      - name: Build and smoke the host package
        run: |
          bun run build
          bun run smoke:native
          bun run smoke:pack

  pack-native:
    name: Pack ${{ matrix.package }}
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: stdnum-linux-x64-gnu
            runner: ubuntu-24.04
          - package: stdnum-linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - package: stdnum-darwin-x64
            runner: macos-15-intel
          - package: stdnum-darwin-arm64
            runner: macos-15
          - package: stdnum-win32-x64-msvc
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.21.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Build native addon
        run: node scripts/build-native-node.mjs

      - name: Pack native sidecar
        id: pack
        working-directory: packages/${{ matrix.package }}
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/npm-tarballs"
          mkdir -p "$pack_dir"
          pack_json="$(npm pack --json --ignore-scripts --pack-destination "$pack_dir")"
          # shellcheck disable=SC2016
          filename="$(node -e '
            const pack = JSON.parse(process.argv[1])[0];
            const files = new Set(pack.files.map(file => file.path));
            for (const required of ["index.cjs", "stella_stdnum_napi.node"]) {
              if (!files.has(required)) throw new Error(`${pack.name} is missing ${required}`);
            }
            process.stdout.write(pack.filename);
          ' "$pack_json")"
          echo "tarball=$pack_dir/$filename" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball-${{ matrix.package }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  pack-portable:
    name: Pack JavaScript and WebAssembly packages
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.21.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust and wasm-bindgen
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.96.0
          rustup default 1.96.0
          cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Build portable packages
        run: |
          bun run codegen:check
          bun run build:ts
          bun run build:wasm
          bun run smoke:wasm
          bun run smoke:browser

      - name: Pack main package
        id: main
        working-directory: packages/stdnum
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/npm-main"
          mkdir -p "$pack_dir"
          pack_json="$(npm pack --json --ignore-scripts --pack-destination "$pack_dir")"
          # shellcheck disable=SC2016
          filename="$(node -e '
            const packs = JSON.parse(process.argv[1]);
            if (packs.length !== 1) throw new Error(`Expected one root tarball, found ${packs.length}`);
            const [pack] = packs;
            if (pack.name !== "@stll/stdnum") throw new Error(`Unexpected root package ${pack.name}`);
            if (pack.version !== process.env.EXPECTED_VERSION) {
              throw new Error(`Root package version ${pack.version} does not match ${process.env.EXPECTED_VERSION}`);
            }
            process.stdout.write(pack.filename);
          ' "$pack_json")"
          tarball="$pack_dir/$filename"
          manifest="$(tar -xOf "$tarball" package/package.json)"
          # shellcheck disable=SC2016
          node -e '
            const manifest = JSON.parse(process.argv[1]);
            if (manifest.name !== "@stll/stdnum") throw new Error(`Unexpected root manifest ${manifest.name}`);
            if (manifest.version !== process.env.EXPECTED_VERSION) {
              throw new Error(`Root manifest version ${manifest.version} does not match ${process.env.EXPECTED_VERSION}`);
            }
          ' "$manifest"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Pack WebAssembly package
        id: wasm
        working-directory: packages/stdnum-wasm
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/npm-wasm"
          mkdir -p "$pack_dir"
          pack_json="$(npm pack --json --ignore-scripts --pack-destination "$pack_dir")"
          # shellcheck disable=SC2016
          filename="$(node -e '
            const pack = JSON.parse(process.argv[1])[0];
            const files = new Set(pack.files.map(file => file.path));
            for (const required of ["native/stella_stdnum_wasm.js", "native/stella_stdnum_wasm_bg.wasm"]) {
              if (!files.has(required)) throw new Error(`${pack.name} is missing ${required}`);
            }
            process.stdout.write(pack.filename);
          ' "$pack_json")"
          echo "tarball=$pack_dir/$filename" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball-stdnum
          path: ${{ steps.main.outputs.tarball }}
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball-stdnum-wasm
          path: ${{ steps.wasm.outputs.tarball }}
          if-no-files-found: error

  build-wheels:
    name: Build Python wheel ${{ matrix.target }}
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            manylinux: auto
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            manylinux: auto
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          rust-toolchain: "1.96.0"
          args: >-
            --release
            --locked
            --manifest-path crates/stdnum-py/Cargo.toml
            --out dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  publish-pypi:
    name: Publish stella-stdnum to PyPI
    needs: [verify, build-wheels]
    if: github.ref == 'refs/heads/main' && (needs.verify.outputs.publish == 'true')
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # Required only for PyPI trusted publishing.
    steps:
      - name: Validate and publish exact Python wheel set
        uses: stella/.github/.github/actions/pypi-publish-hardened@437d9d78c38114a15c368daed7d3d1b36fd6b8fc
        with:
          expected-version: ${{ needs.verify.outputs.version }}
          project-name: stella-stdnum
          distribution-name: stella_stdnum
          wheel-contract: >-
            {"python-wheel-x86_64-unknown-linux-gnu":["manylinux_2_17_x86_64","manylinux2014_x86_64"],"python-wheel-aarch64-unknown-linux-gnu":["manylinux_2_17_aarch64","manylinux2014_aarch64"],"python-wheel-x86_64-apple-darwin":["macosx_10_12_x86_64"],"python-wheel-aarch64-apple-darwin":["macosx_11_0_arm64"],"python-wheel-x86_64-pc-windows-msvc":["win_amd64"]}

  github-release:
    name: Finalize release
    needs:
      [verify, pack-native, pack-portable, publish-pypi]
    if: github.ref == 'refs/heads/main' && (needs.verify.outputs.publish == 'true')
    uses: stella/.github/.github/workflows/npm-version-finalize.yml@437d9d78c38114a15c368daed7d3d1b36fd6b8fc
    with:
      package-files: |
        packages/stdnum/package.json
        packages/stdnum-wasm/package.json
        packages/stdnum-linux-x64-gnu/package.json
        packages/stdnum-linux-arm64-gnu/package.json
        packages/stdnum-darwin-x64/package.json
        packages/stdnum-darwin-arm64/package.json
        packages/stdnum-win32-x64-msvc/package.json
      artifact-pattern: npm-tarball-*
      publish-to-npm: true
      update-changelog: false
    permissions:
      contents: write # Required to create the release tag and GitHub release.
      id-token: write # Required only for npm trusted publishing.
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      CHANGELOG_APP_ID: ${{ secrets.CHANGELOG_APP_ID }}
      CHANGELOG_APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
