name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      publish_to_registries:
        description: Publish npm packages and PyPI wheels after verification
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    outputs:
      dist_tag: ${{ steps.version.outputs.dist_tag }}
      publish: ${{ steps.scope.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require main for manual publishing
        if: >-
          github.event_name == 'workflow_dispatch'
          && inputs.publish_to_registries
          && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Manual publishing must run from main."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve publish scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish_to_registries }}
        run: |
          set -euo pipefail
          publish=false
          if [[ "$EVENT_NAME" == "push" || "$MANUAL_PUBLISH" == "true" ]]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Validate VERSION and derive npm tag
        id: version
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)\.[0-9]+)?$ ]]; then
            echo "::error::Invalid VERSION: $version"
            exit 1
          fi
          dist_tag=latest
          if [[ "$version" =~ -(rc|beta|alpha)\. ]]; then
            dist_tag="${BASH_REMATCH[1]}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.21.1"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          rustup default 1.96.0

      - name: Verify versions and generated sources
        run: |
          bun run version:check
          bun run codegen:check

      - name: Verify source and bindings
        run: |
          bun run typecheck
          bun run lint
          bun run format:check
          cargo test --workspace --locked
          bun test

      - name: Build and smoke the host package
        run: |
          bun run build
          bun run smoke:native
          bun run smoke:pack

  pack-native:
    name: Pack ${{ matrix.package }}
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: stdnum-linux-x64-gnu
            runner: ubuntu-24.04
          - package: stdnum-linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - package: stdnum-darwin-x64
            runner: macos-15-intel
          - package: stdnum-darwin-arm64
            runner: macos-15
          - package: stdnum-win32-x64-msvc
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.21.1"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Build native addon
        run: node scripts/build-native-node.mjs

      - name: Pack native sidecar
        id: pack
        working-directory: packages/${{ matrix.package }}
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/npm-tarballs"
          mkdir -p "$pack_dir"
          pack_json="$(npm pack --json --ignore-scripts --pack-destination "$pack_dir")"
          # shellcheck disable=SC2016
          filename="$(node -e '
            const pack = JSON.parse(process.argv[1])[0];
            const files = new Set(pack.files.map(file => file.path));
            for (const required of ["index.cjs", "stella_stdnum_napi.node"]) {
              if (!files.has(required)) throw new Error(`${pack.name} is missing ${required}`);
            }
            process.stdout.write(pack.filename);
          ' "$pack_json")"
          echo "tarball=$pack_dir/$filename" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball-${{ matrix.package }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  pack-portable:
    name: Pack JavaScript and WebAssembly packages
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.21.1"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust and wasm-bindgen
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.96.0
          rustup default 1.96.0
          cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Build portable packages
        run: |
          bun run codegen:check
          bun run build:ts
          bun run build:wasm
          bun run smoke:wasm
          bun run smoke:browser

      - name: Pack main package
        id: main
        working-directory: packages/stdnum
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/npm-main"
          mkdir -p "$pack_dir"
          pack_json="$(npm pack --json --ignore-scripts --pack-destination "$pack_dir")"
          # shellcheck disable=SC2016
          filename="$(node -e '
            const packs = JSON.parse(process.argv[1]);
            if (packs.length !== 1) throw new Error(`Expected one root tarball, found ${packs.length}`);
            const [pack] = packs;
            if (pack.name !== "@stll/stdnum") throw new Error(`Unexpected root package ${pack.name}`);
            if (pack.version !== process.env.EXPECTED_VERSION) {
              throw new Error(`Root package version ${pack.version} does not match ${process.env.EXPECTED_VERSION}`);
            }
            process.stdout.write(pack.filename);
          ' "$pack_json")"
          tarball="$pack_dir/$filename"
          manifest="$(tar -xOf "$tarball" package/package.json)"
          # shellcheck disable=SC2016
          node -e '
            const manifest = JSON.parse(process.argv[1]);
            if (manifest.name !== "@stll/stdnum") throw new Error(`Unexpected root manifest ${manifest.name}`);
            if (manifest.version !== process.env.EXPECTED_VERSION) {
              throw new Error(`Root manifest version ${manifest.version} does not match ${process.env.EXPECTED_VERSION}`);
            }
          ' "$manifest"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Pack WebAssembly package
        id: wasm
        working-directory: packages/stdnum-wasm
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/npm-wasm"
          mkdir -p "$pack_dir"
          pack_json="$(npm pack --json --ignore-scripts --pack-destination "$pack_dir")"
          # shellcheck disable=SC2016
          filename="$(node -e '
            const pack = JSON.parse(process.argv[1])[0];
            const files = new Set(pack.files.map(file => file.path));
            for (const required of ["native/stella_stdnum_wasm.js", "native/stella_stdnum_wasm_bg.wasm"]) {
              if (!files.has(required)) throw new Error(`${pack.name} is missing ${required}`);
            }
            process.stdout.write(pack.filename);
          ' "$pack_json")"
          echo "tarball=$pack_dir/$filename" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball-stdnum
          path: ${{ steps.main.outputs.tarball }}
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball-stdnum-wasm
          path: ${{ steps.wasm.outputs.tarball }}
          if-no-files-found: error

  build-wheels:
    name: Build Python wheel ${{ matrix.target }}
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            manylinux: auto
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            manylinux: auto
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          rust-toolchain: "1.96.0"
          args: >-
            --release
            --locked
            --manifest-path crates/stdnum-py/Cargo.toml
            --out dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  publish-pypi:
    name: Publish stella-stdnum to PyPI
    needs: [verify, build-wheels]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # Required only for PyPI trusted publishing.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: python-wheel-*
          path: dist
          merge-multiple: true

      - name: Verify exact wheel release set
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import email.parser
          import os
          import re
          import zipfile
          from pathlib import Path

          expected_version = re.sub(
              r"-(alpha|beta|rc)\.(\d+)$",
              lambda match: {
                  "alpha": "a",
                  "beta": "b",
                  "rc": "rc",
              }[match.group(1)] + match.group(2),
              os.environ["EXPECTED_VERSION"],
          )
          expected_platforms = {
              "linux-aarch64": re.compile(
                  r"^manylinux_2_17_aarch64\.manylinux2014_aarch64$"
              ),
              "linux-x86_64": re.compile(
                  r"^manylinux_2_17_x86_64\.manylinux2014_x86_64$"
              ),
              "macos-arm64": re.compile(
                  r"^macosx_11_0_arm64$"
              ),
              "macos-x86_64": re.compile(
                  r"^macosx_10_12_x86_64$"
              ),
              "windows-x86_64": re.compile(r"^win_amd64$"),
          }
          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != len(expected_platforms):
              raise SystemExit(
                  f"Expected {len(expected_platforms)} wheels, found {len(wheels)}"
              )

          found_platforms = set()
          for wheel in wheels:
              package, python_tag, abi_tag, platform_tag = wheel.stem.rsplit("-", 3)
              distribution, filename_version = package.rsplit("-", 1)
              if distribution != "stella_stdnum":
                  raise SystemExit(f"Unexpected wheel distribution: {distribution}")
              if filename_version != expected_version:
                  raise SystemExit(
                      f"Wheel version {filename_version} does not match {expected_version}"
                  )
              if python_tag != "cp311" or abi_tag != "abi3":
                  raise SystemExit(
                      f"Unexpected Python/ABI tag: {python_tag}-{abi_tag}"
                  )

              matches = [
                  name
                  for name, pattern in expected_platforms.items()
                  if pattern.fullmatch(platform_tag)
              ]
              if len(matches) != 1:
                  raise SystemExit(f"Unexpected wheel platform tag: {platform_tag}")
              found_platforms.add(matches[0])

              with zipfile.ZipFile(wheel) as archive:
                  metadata_files = [
                      name
                      for name in archive.namelist()
                      if name.endswith(".dist-info/METADATA")
                  ]
                  if len(metadata_files) != 1:
                      raise SystemExit(
                          f"{wheel.name} contains {len(metadata_files)} METADATA files"
                      )
                  metadata = email.parser.BytesParser().parsebytes(
                      archive.read(metadata_files[0])
                  )
              normalized_name = re.sub(r"[-_.]+", "-", metadata["Name"].lower())
              if normalized_name != "stella-stdnum":
                  raise SystemExit(f"Unexpected METADATA Name: {metadata['Name']}")
              if metadata["Version"] != expected_version:
                  raise SystemExit(
                      f"METADATA version {metadata['Version']} does not match {expected_version}"
                  )

          if found_platforms != set(expected_platforms):
              missing = sorted(set(expected_platforms) - found_platforms)
              raise SystemExit(f"Missing wheel platforms: {', '.join(missing)}")
          PY

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist

  github-release:
    name: Finalize release
    needs:
      [verify, pack-native, pack-portable, publish-pypi]
    if: needs.verify.outputs.publish == 'true'
    uses: stella/.github/.github/workflows/npm-version-finalize.yml@c75efcc5483920fb2984fe0f22e4489cd6d01f57
    with:
      package-files: |
        packages/stdnum/package.json
        packages/stdnum-wasm/package.json
        packages/stdnum-linux-x64-gnu/package.json
        packages/stdnum-linux-arm64-gnu/package.json
        packages/stdnum-darwin-x64/package.json
        packages/stdnum-darwin-arm64/package.json
        packages/stdnum-win32-x64-msvc/package.json
      artifact-pattern: npm-tarball-*
      publish-to-npm: true
      update-changelog: false
    permissions:
      contents: write # Required to create the release tag and GitHub release.
      id-token: write # Required only for npm trusted publishing.
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      CHANGELOG_APP_ID: ${{ secrets.CHANGELOG_APP_ID }}
      CHANGELOG_APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
