name: Package quarantine prune

on:
  schedule:
    - cron: "11 * * * *"

permissions:
  contents: read

jobs:
  prune:
    name: Remove expired quarantine exceptions
    if: github.repository == 'stella/stdnum'
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/quarantine-prune.yml@0f814e1a0c6c7401778e661209553b6e15f8d92a
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
